name: CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Backend Dependencies
        run: |
          cd yummy_v7/yummy/backend
          npm install

      - name: Install Frontend Dependencies
        run: |
          cd yummy_v7/yummy/frontend
          npm install

      - name: Build React App
        run: |
          cd yummy_v7/yummy/frontend
          npm run build
