name: CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # 🔍 SHOW REPO (root)
      - name: Show Repository Root
        run: |
          pwd
          ls -la

      # 🔍 SHOW PROJECT STRUCTURE
      - name: Show Project Structure
        run: |
          ls -R yummy_v7

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # ✅ Backend install
      - name: Install Backend Dependencies
        run: |
          cd yummy_v7/yummy/backend
          ls -la   # 🔍 confirm backend files
          npm install

      # 🔥 Run tests
      - name: Run Backend Tests
        run: |
          cd yummy_v7/yummy/backend
          npm test

      # ✅ Frontend
      - name: Install Frontend Dependencies
        run: |
          cd yummy_v7/yummy/frontend
          ls -la   # 🔍 confirm frontend files
          npm install

      - name: Build React App
        run: |
          cd yummy_v7/yummy/frontend
          npm run build
